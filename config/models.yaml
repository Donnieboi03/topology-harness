# Compound Topologies / topology-harness — example model routing
# Host copies or generates equivalent config. Do not commit API keys.

provider: openrouter
base_url: https://openrouter.ai/api/v1

# Primary models by role (example OpenRouter ids)
roles:
  main: google/gemini-3-flash-preview
  topic_owner: google/gemini-3-flash-preview   # Topic Orchestrator (TO)
  generator: google/gemini-3.5-flash
  critiquer: google/gemini-3.5-flash
  scout: google/gemini-3-flash-preview         # TT research lanes
  router: google/gemini-2.5-flash-lite         # classify-only (optional)

preference:
  model: google/gemini-3-flash-preview
  delegation_model: google/gemini-3-flash-preview

fallbacks:
  - google/gemini-2.5-flash
  - anthropic/claude-3.5-haiku
  - openai/gpt-4.1-mini

allowlist:
  - google/gemini-3-flash-preview
  - google/gemini-3.5-flash
  - google/gemini-2.5-flash
  - google/gemini-2.5-flash-lite
  - amazon/nova-micro-v1
  - qwen/qwen-2.5-7b-instruct
  - anthropic/claude-3.5-haiku
  - openai/gpt-4.1-mini

# Optional non-OpenRouter escape (host may ignore)
secondary_provider:
  provider: gemini
  model: gemini-2.5-flash
