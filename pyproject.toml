[project]
name = "agent-topo-harness"
version = "0.3.0"
description = "Compound Topologies control plane — host-agnostic Main → Orchestrator → TT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-topo-cost-smoke = "agent_topo_harness.cost_smoke:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
