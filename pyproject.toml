[project]
name = "topology-harness"
version = "0.4.0"
description = "Compound Topologies control plane — host-agnostic Main → TO (Topic Orchestrator) → TT"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
topology-harness = "topology_harness.run:main"
topology-cost-smoke = "topology_harness.cost_smoke:main"
agent-topo-cost-smoke = "topology_harness.cost_smoke:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
